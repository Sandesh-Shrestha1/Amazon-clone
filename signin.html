<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="stylesheet" href="style/sign.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
</head>
<body>
   
    <div class="box-post">
         <a href="index.html"><img src="assets/amazon_logo_dark.png" class="amazon-logo"></a>
        <div class="box">
            <h2>Sign in or create account</h2>
            <p class="desc">Enter mobile number or email</p>
            <form action="" class="email-option">
                <input type="email" class="mail" /required>
                <button type="submit" class="submit" onclick="continueBtn()">Continue</button>
            </form>
            <div class="extra-option">
                <p class="privacy">By continuing, you agree to Amazon's<a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a></p>
                <p class="support"><a href="#">Need help?</a></p>
            </div>
            <div class="business-account">
                <h2>Buying for work?</h2>
                <a href="#">Create a free business account</a>
            </div>
        </div>
    </div>
</body>
<script src="scripts/sign.js"></script>
</html>
